plugins { id 'com.android.application' }

android {
    namespace 'com.omer.ceptavla'
    compileSdk 34

    defaultConfig {
        applicationId 'com.omer.ceptavla'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        app {
            storeFile file('ceptavla.keystore')
            storePassword 'ceptavla'
            keyAlias 'ceptavla'
            keyPassword 'ceptavla'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
